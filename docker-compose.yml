services:
  mysql:
    image: mysql:8.0
    container_name: application-support-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ouroboros_application_db}
      MYSQL_USER: ${APP_DB_USERNAME:-ouroboros_app}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-app_password}
    ports:
      - "${DOCKER_MYSQL_PORT:-3308}:3306"
    networks:
      ouroboros-net:
        aliases:
          - application-support-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  application-support:
    build: .
    container_name: application-support-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8005:8005"
    networks:
      - ouroboros-net
    env_file:
      - .env
    environment:
      - DB_HOST=application-support-mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ouroboros_application_db}
      - DB_USERNAME=${APP_DB_USERNAME:-ouroboros_app}
      - DB_PASSWORD=${APP_DB_PASSWORD:-app_password}
      - MYSQL_HOST=application-support-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${DB_NAME:-ouroboros_application_db}
      - MYSQL_USER=${APP_DB_USERNAME:-ouroboros_app}
      - MYSQL_PASSWORD=${APP_DB_PASSWORD:-app_password}
      - ALLOW_DB_FAILURE=false
      # Internal bearer token verification/JWKS settings come from env_file (.env).
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: ./start.sh

volumes:
  mysql_data:

networks:
  ouroboros-net:
    name: ${OUROBOROS_DOCKER_NETWORK:-ouroboros-net}
